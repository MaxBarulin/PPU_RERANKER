<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка ППУ</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
  --accent: #2f5bea; --accent-text: #fff;
  --repeat: #c2410c; --repeat-bg: #fff1e8;
  --other: #a16207; --other-bg: #fef8e6;
  --similar: #1d4ed8; --similar-bg: #eaf1ff;
  --unique: #15803d; --unique-bg: #e9f8ee;
  --alt: #7e22ce; --alt-bg: #f5ecff;
  --far: #98a2b3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #98a2b3; --line: #2c323d;
    --accent: #6d8cff; --accent-text: #0d1117;
    --repeat: #fb923c; --repeat-bg: #2d1c12;
    --other: #facc15; --other-bg: #2a2410;
    --similar: #93b4ff; --similar-bg: #18233d;
    --unique: #4ade80; --unique-bg: #12291b;
    --alt: #d8b4fe; --alt-bg: #261a36;
    --far: #667085;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 8px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
         display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
header .logo-link { justify-self: start; display: block; line-height: 0; }
header .logo { height: 46px; width: auto; display: block; } /* фон прозрачный */
header .center { text-align: center; }
header h1 { margin: 0; font-size: 18px; line-height: 1.3; }
header .info { color: var(--muted); font-size: 13px; }
header .links { justify-self: end; display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
header .links a { color: var(--accent); font-size: 13px; }
@media (max-width: 760px) { header { grid-template-columns: 1fr; justify-items: center; gap: 8px; }
                            header .logo-link, header .links { justify-self: center; }
                            header .logo { height: 32px; } }
main { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; gap: 20px;
       padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
form label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
form label:first-child { margin-top: 0; }
form label small { font-weight: 400; color: var(--muted); }
input, textarea { width: 100%; font: inherit; color: inherit; background: var(--bg);
                  border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
textarea { min-height: 92px; resize: vertical; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 7px; padding: 9px 18px;
         background: var(--accent); color: var(--accent-text); cursor: pointer; }
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
button:disabled { opacity: .55; cursor: wait; }
.hint { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); text-align: center; padding: 60px 20px; }
.error { color: var(--repeat); background: var(--repeat-bg); border-radius: 8px; padding: 12px 14px; }
.verdict { border-radius: 10px; padding: 16px 20px; margin-bottom: 16px;
           display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
/* одинаковая высота до, во время и после подробной проверки (отметка «Спорный случай» может пропасть) */
.verdict .v-main { min-width: 0; min-height: 108px; display: flex; flex-direction: column; justify-content: center; }
.verdict .v-main > .flag { align-self: flex-start; }
.verdict .v-side { width: 260px; align-self: stretch; padding-left: 24px; border-left: 1px solid var(--line);
                   display: flex; flex-direction: column; justify-content: center; gap: 8px; text-align: center; }
button.big { width: 100%; height: 46px; padding: 0 20px; font-size: 16px; border-radius: 9px;
             box-shadow: 0 2px 8px rgba(0,0,0,.15); }
button.big:disabled { cursor: wait; opacity: .8; }
.v-side .note { font-size: 12px; line-height: 1.5; color: var(--muted); min-height: 36px; }
.v-side .done { height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px;
                border: 1px solid currentColor; border-radius: 9px; font-weight: 600; font-size: 15px; }
button.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline;
              font-weight: 400; font-size: 12px; cursor: pointer; }
@media (max-width: 700px) { .verdict { grid-template-columns: 1fr; gap: 14px; }
                            .verdict .v-main { min-height: 0; }
                            .verdict .v-side { width: auto; padding: 14px 0 0; border-left: 0; border-top: 1px solid var(--line); } }
.verdict h2 { margin: 0 0 4px; font-size: 19px; }
.verdict .meta { font-size: 13px; color: var(--muted); }
.v-repeat { background: var(--repeat-bg); color: var(--repeat); }
.v-other_place { background: var(--other-bg); color: var(--other); }
.v-similar { background: var(--similar-bg); color: var(--similar); }
.v-unique { background: var(--unique-bg); color: var(--unique); }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 10px 0 4px; max-width: 360px; }
.meter > div { height: 100%; background: currentColor; }
.flag { display: inline-block; margin-top: 8px; font-size: 13px; padding: 2px 8px; border-radius: 5px;
        border: 1px dashed var(--muted); color: var(--muted); }
.cand { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 10px; background: var(--panel); }
.cand summary { list-style: none; cursor: pointer; padding: 12px 14px 12px 10px; display: grid;
                grid-template-columns: 78px 1fr auto; gap: 0; align-items: stretch; }
.cand summary > .score { padding-right: 12px; border-right: 1px solid var(--line);
                         display: flex; flex-direction: column; justify-content: center; align-items: center; }
.cand summary > .body { padding: 0 14px; align-self: center; min-width: 0; }
.cand summary > .badges { padding-left: 12px; border-left: 1px solid var(--line); justify-content: center; }
.cand summary::-webkit-details-marker { display: none; }
.score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 22px; text-align: center; line-height: 1.2; }
.score small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.title { font-weight: 600; font-size: 16px; }
.title .no { white-space: nowrap; }
.status { display: inline-block; font-size: 13px; font-weight: 600; padding: 1px 9px; border-radius: 10px;
          margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.st-done { color: var(--unique); background: var(--unique-bg); }
.st-accepted { color: var(--similar); background: var(--similar-bg); }
.st-progress { color: var(--other); background: var(--other-bg); }
.st-rejected, .st-other { color: var(--muted); background: var(--bg); border: 1px solid var(--line); }
.sub { font-size: 13px; color: var(--muted); }
.badge { font-size: 14px; font-weight: 600; padding: 4px 11px; border-radius: 12px;
         max-width: 170px; text-align: center; line-height: 1.3; }
.r-repeat { color: var(--repeat); background: var(--repeat-bg); }
.r-other_place { color: var(--other); background: var(--other-bg); }
.r-similar { color: var(--similar); background: var(--similar-bg); }
.r-alternative, .v-alternative { color: var(--alt); background: var(--alt-bg); }
.badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.unsure { font-size: 12px; color: var(--muted); white-space: nowrap; }
.why { font-size: 13px; margin-top: 4px; color: var(--text); }
.match { font-size: 12px; color: var(--muted); margin-top: 2px; }
.match b { font-weight: 600; color: var(--text); }
.topic { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 12px 16px;
         margin-bottom: 12px; font-size: 16px; }
.topic .words { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 15px; }
button.word { font: inherit; font-size: 15px; font-weight: 600; padding: 3px 12px; border-radius: 14px;
              background: var(--similar-bg); color: var(--similar); border: 1px solid transparent; cursor: pointer; }
button.word:hover, button.word.on { border-color: var(--similar); }
.wl { background: var(--panel); border: 1px solid var(--similar); border-radius: 9px; padding: 12px 14px; margin-bottom: 12px; }
.wl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.wl-head b { font-size: 15px; }
.wl details { border-top: 1px solid var(--line); padding: 7px 0; }
.wl summary { cursor: pointer; list-style: none; }
.wl summary::-webkit-details-marker { display: none; }
.wl .details { padding: 8px 0 4px; }
details.more { margin-top: 6px; }
details.more > summary { cursor: pointer; list-style: none; padding: 10px 14px; border: 1px dashed var(--line);
                         border-radius: 9px; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
details.more[open] > summary { color: var(--muted); }
.external { margin-top: 8px; font-size: 12px; color: var(--repeat); }
button.small { padding: 5px 12px; font-size: 13px; }
.r-far { color: var(--far); background: var(--bg); }
.details { padding: 0 14px 14px 102px; display: grid; gap: 10px; }
@media (max-width: 600px) { .details { padding-left: 14px; } .cand summary { grid-template-columns: 62px 1fr; }
                            .cand summary > .badges { grid-column: 2; border-left: 0; padding: 8px 14px 0;
                                                      align-items: flex-start; } }
.details h4 { margin: 0 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.details p { margin: 0; white-space: pre-wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <a class="logo-link" href="/"><img class="logo" src="/logo.png" alt="ОСК «Адмиралтейские верфи»"></a>
  <div class="center">
    <h1>Проверка ППУ на повторы</h1>
    <div class="info" id="info">загрузка…</div>
  </div>
  <nav class="links">
    <a href="/admin">обновить базу</a>
    <a href="/label">разметка для калибровки</a>
  </nav>
</header>
<main>
  <section class="panel">
    <form id="form">
      <label for="name">Наименование</label>
      <input id="name" name="name" required minlength="3" autocomplete="off">
      <label for="before">До улучшения <small>- в чём проблема</small></label>
      <textarea id="before" name="before"></textarea>
      <label for="after">После улучшения <small>- что стало</small></label>
      <textarea id="after" name="after"></textarea>
      <label for="proposal">Предложения <small>- что сделать</small></label>
      <textarea id="proposal" name="proposal"></textarea>
      <div class="actions">
        <button type="submit" id="go">Проверить</button>
        <button type="button" class="ghost" id="clear">Очистить</button>
        <span class="hint">Ctrl+Enter</span>
      </div>
    </form>
  </section>
  <section id="out"><div class="panel empty">Заполните ППУ и нажмите «Проверить»</div></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const FIELDS = ["name", "before", "after", "proposal"];
const RELATION = { repeat: "повтор", other_place: "другое подразделение",
                   alternative: "та же проблема, другое решение", similar: "похоже", far: "далеко" };
const PLACE = { same: "то же место", other: "другое место", unknown: "" };
let queryHasPlace = false, llmAvailable = false, llmExternal = null, lastBody = null;
const ENTITY = { workshops: "цех", sites: "участок", places: "", projects: "проект", models: "модель", inventory: "инв. №" };

// все тире и прочерки (в том числе из текстов реестра) показываем обычным "-"
const esc = (s) => String(s ?? "").replace(/[\u2010-\u2015\u2212\uFE58\uFE63\uFF0D]/g, "-").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function chips(entities) {
  const items = Object.entries(entities || {}).flatMap(([k, vs]) =>
    vs.map((v) => `<span class="chip">${esc(ENTITY[k] ? ENTITY[k] + " " + v : v)}</span>`));
  return items.length ? `<div class="chips">${items.join("")}</div>` : "";
}

// «дата подачи: 2026-09-15 · ЭЭ: 12 000 · другое место» - подписи как у «общие слова»
function facts(date, effect, extra = []) {
  const items = [];
  if (date) items.push(`дата подачи: <b>${esc(date)}</b>`);
  if (effect) items.push(`ЭЭ: <b>${esc(Number(effect).toLocaleString("ru-RU"))}</b>`);
  for (const x of extra) if (x) items.push(esc(x));
  return items.length ? `<div class="match">${items.join(" · ")}</div>` : "";
}

// цветная метка статуса из реестра
function statusClass(s) {
  s = (s || "").toLowerCase();
  if (s.includes("реализ")) return "st-done";
  if (s.includes("отклон")) return "st-rejected";
  if (s.includes("исполн") || s.includes("рассмотр")) return "st-progress";
  if (s.includes("принят")) return "st-accepted";
  return "st-other";
}

// «№ 10988 · Название [Статус]»; у записей без рег. номера (row…/db…) номера нет
function titleLine(id, name, status) {
  const no = id && !/^(row|db)\d+$/.test(id) ? `<span class="no">№ ${esc(id)}</span> · ` : "";
  const st = status ? `<span class="status ${statusClass(status)}">${esc(status)}</span>` : "";
  return `<div class="title">${no}${esc(name)}${st}</div>`;
}

function candidate(c) {
  const t = c.texts || {};
  const block = (title, text) => text ? `<div><h4>${title}</h4><p>${esc(text)}</p></div>` : "";
  const placeNote = c.place === "unknown" && queryHasPlace && c.relation === "repeat"
    ? "место в найденном не указано" : PLACE[c.place];
  const factsLine = facts(c.date_submitted, c.effect,
                          [placeNote, c.completeness === "name_only" ? "в реестре только название" : ""]);
  const body = block("До улучшения", t.before) + block("После улучшения", t.after)
             + block("Предложения", t.proposal) + block("Результат", t.result) + chips(c.entities);
  const llm = c.llm ? `<div class="why">Подробная проверка: ${esc(c.llm.why || RELATION[c.relation])}${
    c.relation_vectors !== c.relation ? ` <span class="sub">(быстрая проверка: ${RELATION[c.relation_vectors]})</span>` : ""}</div>` : "";
  const match = c.matched && c.matched.length
    ? `<div class="match">общие слова: <b>${esc(c.matched.join(", "))}</b></div>` : "";
  return `<details class="cand">
    <summary>
      <div class="score">${Math.round(c.score * 100)}%<small>близость</small></div>
      <div class="body">${titleLine(c.id, c.name, c.status)}${factsLine}${match}${llm}</div>
      <div class="badges"><span class="badge r-${c.relation}">${RELATION[c.relation]}</span>
        ${c.uncertain ? '<span class="unsure">не уверен</span>' : ""}</div>
    </summary>
    <div class="details">${body || '<p class="sub">Описания нет - в реестре «См.вложение»</p>'}</div>
  </details>`;
}

function render(res) {
  const u = Math.round(res.uniqueness * 100);
  const e = res.query.entities || {};
  queryHasPlace = Boolean(e.workshops || e.sites || e.places);
  const cands = res.candidates.map(candidate).join("");
  const more = res.more || [];
  const tp = res.topic || { words: [] };
  const words = tp.words.map((x) => `<button type="button" class="word" data-word="${esc(x.word)}"
      title="Показать все ППУ со словом «${esc(x.word)}»">«${esc(x.word)}» - ${x.count} ППУ</button>`).join("");
  const topic = `<div class="topic">${tp.close ? `Похожих по смыслу: <b>${tp.close}</b>` : "Похожих по смыслу нет"}${
      tp.more ? ` · ещё по теме: <b>${tp.more}</b> <span class="sub">(«Показать ещё» внизу)</span>` : ""}${
      words ? `<div class="words">Во всей базе: ${words} <span>- нажмите, чтобы увидеть все</span></div>` : ""}</div>
    <div id="word-list"></div>`;
  $("#out").innerHTML = `
    ${res.candidates.length || more.length || words ? topic : ""}
    <div class="verdict v-${res.verdict}">
      <div class="v-main">
        <h2>${esc(res.verdict_text)}</h2>
        <div class="meter"><div style="width:${u}%"></div></div>
        <div class="meta">Уникальность ${u}%${res.judged_by === "llm" ? " · проверено подробно" : ""}</div>
        ${res.needs_llm ? '<span class="flag">Спорный случай</span>' : ""}
      </div>
      ${llmAvailable && res.candidates.length ? `
        <div class="v-side">${res.judged_by === "llm" ? `
          <div class="done">Проверено подробно</div>
          <div class="note">пояснения - в карточках ниже</div>` : `
          <button type="button" id="ask-llm" class="big">Проверить подробнее</button>
          <div class="note" id="llm-status">${LLM_HINT(res.candidates.length)}</div>
          ${llmExternal ? `<div class="external">Текст ППУ и найденных записей уйдёт во внешний сервис: ${esc(llmExternal)}</div>` : ""}`}
        </div>` : ""}
    </div>
    ${cands || '<div class="panel empty">Кандидатов нет</div>'}
    ${more.length ? `<details class="more"><summary>Показать ещё ${more.length}
        <small>По смыслу они далеко от нового ППУ, но могут пригодиться: общие слова, та же тема</small></summary>
        ${more.map(candidate).join("")}</details>` : ""}`;
  $("#ask-llm")?.addEventListener("click", askLLM);
  document.querySelectorAll("button.word").forEach((b) => b.addEventListener("click", () => showWord(b)));
}

async function post(url, body, signal) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify(body), signal });
  const data = await r.json();
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
  return data;
}

async function check(ev) {
  ev?.preventDefault();
  if (!$("#form").reportValidity()) return;
  lastBody = Object.fromEntries(FIELDS.map((f) => [f, $("#" + f).value.trim()]));
  $("#go").disabled = true; $("#go").textContent = "Проверяю…";
  try {
    render(await post("/api/assess", lastBody));
  } catch (e) {
    $("#out").innerHTML = `<div class="error">Не удалось проверить: ${esc(e.message)}</div>`;
  } finally {
    $("#go").disabled = false; $("#go").textContent = "Проверить";
  }
}

// все ППУ базы, где встречается слово (в любой форме)
async function showWord(btn) {
  const box = $("#word-list");
  if (btn.classList.contains("on")) { btn.classList.remove("on"); box.innerHTML = ""; return; }
  document.querySelectorAll("button.word.on").forEach((b) => b.classList.remove("on"));
  btn.classList.add("on");
  box.innerHTML = '<div class="wl"><span class="sub">загрузка…</span></div>';
  try {
    const r = await fetch("/api/word?w=" + encodeURIComponent(btn.dataset.word));
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    const block = (title, text) => text ? `<div><h4>${title}</h4><p>${esc(text)}</p></div>` : "";
    const rows = d.records.map((x) => {

      const body = block("До улучшения", x.before) + block("После улучшения", x.after) + block("Предложения", x.proposal);
      return `<details><summary>${titleLine(x.id, x.name, x.status)}${facts(x.date_submitted, x.effect)}</summary>
        <div class="details">${body || '<p class="sub">Описания нет - в реестре «См.вложение»</p>'}</div></details>`;
    }).join("");
    box.innerHTML = `<div class="wl"><div class="wl-head"><b>Все ППУ со словом «${esc(d.word)}»: ${d.count}</b>
        <button type="button" class="ghost small" id="wl-close">Скрыть</button></div>
      ${d.count > d.records.length ? `<div class="sub">Показаны ${d.records.length} самых новых</div>` : ""}${rows}</div>`;
    $("#wl-close").addEventListener("click", () => { btn.classList.remove("on"); box.innerHTML = ""; });
  } catch (e) {
    box.innerHTML = `<div class="error">Не удалось загрузить список: ${esc(e.message)}</div>`;
  }
}

const LLM_HINT = (n) => `медленнее: сервис внимательно перечитает ${n === 1 ? "найденное ППУ" : `все ${n} ППУ из списка`}`;

async function askLLM() {
  const btn = $("#ask-llm"), status = $("#llm-status"), started = Date.now();
  // обрыв запроса браузером сервер замечает и останавливает генерацию в LLM
  const ctrl = new AbortController();
  // во время проверки - та же кнопка со счётчиком и «отменить» на месте подсказки: высота не меняется
  btn.disabled = true;
  const tick = () => (btn.textContent = `Читаю тексты… ${Math.round((Date.now() - started) / 1000)} с`);
  tick();
  status.innerHTML = '<button type="button" class="link" id="cancel-llm">отменить</button>';
  $("#cancel-llm").onclick = () => ctrl.abort();
  const timer = setInterval(tick, 1000);
  try {
    render(await post("/api/judge", lastBody, ctrl.signal));
  } catch (e) {
    btn.disabled = false; btn.textContent = "Проверить подробнее";
    status.textContent = e.name === "AbortError" ? "отменено" : `не удалось: ${e.message}`;
  } finally {
    clearInterval(timer);
  }
}

$("#form").addEventListener("submit", check);
$("#form").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.ctrlKey) check(e); });
$("#clear").addEventListener("click", () => {
  FIELDS.forEach((f) => ($("#" + f).value = ""));
  $("#out").innerHTML = '<div class="panel empty">Заполните ППУ и нажмите «Проверить»</div>';
  $("#name").focus();
});
fetch("/api/info").then((r) => r.json()).then((i) => {
  llmAvailable = i.llm;
  llmExternal = i.llm && !i.llm_local ? i.llm_host : null;
  if (!i.index) {
    $("#info").textContent = "база ещё не загружена";
    $("#out").innerHTML = '<div class="panel empty">Базы ППУ ещё нет - <a href="/admin">загрузите реестр</a></div>';
    return;
  }
  $("#info").textContent = `в реестре ${i.records.toLocaleString("ru-RU")} ППУ · индекс от ${(i.built || "").replace("T", " ")}`
    + (i.rebuild === "running" ? " · идёт обновление базы" : "")
    + (i.llm ? "" : " · подробная проверка недоступна");
}).catch(() => ($("#info").textContent = "сервер недоступен"));
</script>
</body>
</html>

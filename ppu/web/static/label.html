<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разметка пар ППУ</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
  --accent: #2f5bea; --accent-text: #fff; --picked: #e8eefe;
}
@media (prefers-color-scheme: dark) {
  header .logo { background: #fff; border-radius: 6px; padding: 3px 6px; }
  :root {
    --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #98a2b3; --line: #2c323d;
    --accent: #6d8cff; --accent-text: #0d1117; --picked: #1e2a48;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 150px; }
header { padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
         display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
header .logo-link { justify-self: start; display: block; line-height: 0; }
header .logo { height: 42px; width: auto; display: block; }
header .center { text-align: center; }
header h1 { margin: 0; font-size: 18px; line-height: 1.3; }
header .links { justify-self: end; display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; }
header .links a { color: var(--accent); font-size: 13px; }
@media (max-width: 760px) { header { grid-template-columns: 1fr; justify-items: center; gap: 8px; }
                            header .logo-link, header .links { justify-self: center; }
                            header .logo { height: 32px; } }
.progress { color: var(--muted); font-size: 13px; }
.bar { height: 4px; background: var(--line); }
.bar > div { height: 100%; background: var(--accent); transition: width .2s; }
main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px;
       max-width: 1400px; margin: 0 auto; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card h2 { margin: 0 0 4px; font-size: 17px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.card h4 { margin: 12px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.card p { margin: 0; white-space: pre-wrap; }
.empty { color: var(--muted); font-style: italic; }
footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
         border-top: 1px solid var(--line); padding: 10px 16px; }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 1400px; margin: 0 auto; }
footer button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--text);
                border-radius: 8px; padding: 7px 12px; cursor: pointer; text-align: left; max-width: 230px; }
footer button b { display: block; font-size: 14px; }
footer button small { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }
footer button kbd { font: 600 11px ui-monospace, monospace; border: 1px solid var(--line);
                    border-radius: 4px; padding: 0 4px; margin-right: 4px; }
footer button.picked { background: var(--picked); border-color: var(--accent); }
footer button:hover { border-color: var(--accent); }
@media (max-width: 1000px) {
  footer button small { display: none; }
  footer button { padding: 6px 10px; }
  body { padding-bottom: 110px; }
}
.done { text-align: center; padding: 60px 20px; grid-column: 1 / -1; }
.done code { background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; border-radius: 5px; }
.error { grid-column: 1 / -1; color: #c2410c; }
.login { grid-column: 1 / -1; max-width: 420px; width: 100%; margin: 40px auto 0; background: var(--panel);
         border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.login h2 { margin: 0 0 6px; font-size: 17px; }
.login input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
               border-radius: 7px; padding: 8px 10px; margin: 8px 0 12px; }
.login button { font: inherit; font-weight: 600; border: 0; border-radius: 7px; padding: 9px 18px;
                background: var(--accent); color: var(--accent-text); cursor: pointer; }
.login .err { color: #c2410c; font-size: 13px; margin-top: 8px; min-height: 18px; }
.llm-note { grid-column: 1 / -1; background: var(--picked); border: 1px solid var(--accent); border-radius: 10px;
            padding: 10px 14px; font-size: 14px; }
.llm-note small { color: var(--muted); }
</style>
</head>
<body>
<header>
  <a class="logo-link" href="/"><img class="logo" src="/logo.png" alt="ОСК «Адмиралтейские верфи»"></a>
  <div class="center"><h1>Разметка пар ППУ</h1><div class="progress" id="progress">загрузка…</div></div>
  <nav class="links">
    <a href="/">← к проверке ППУ</a>
    <a href="/admin#calib">калибровка</a>
  </nav>
</header>
<div class="bar"><div id="bar" style="width:0"></div></div>
<main id="main"></main>
<footer>
  <div class="buttons" id="buttons"></div>
</footer>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Одни и те же определения у всех разметчиков
const OPTIONS = [
  ["1", "repeat", "Повтор", "та же проблема и по сути то же решение"],
  ["2", "other_place", "То же, другое подразделение", "то же предложение для другого цеха/участка"],
  ["3", "alternative", "Та же проблема, другое решение", ""],
  ["4", "similar", "Похоже", "та же тема или оборудование, но проблема другая"],
  ["5", "different", "Не связаны", ""],
  ["0", "unclear", "Непонятно", "пропустить, в подбор не пойдёт"],
];
const ENTITY = { workshops: "цех", sites: "участок", places: "", projects: "проект", models: "модель", inventory: "инв. №" };
let current = null;
// Пароль администратора — тот же, что на /admin; хранится только в этой вкладке
const TOKEN_KEY = "ppu_admin_token";
function getToken() { try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } }
function setToken(v) { try { v ? sessionStorage.setItem(TOKEN_KEY, v) : sessionStorage.removeItem(TOKEN_KEY); } catch {} }
const auth = (extra = {}) => getToken() ? { ...extra, "X-Admin-Token": encodeURIComponent(getToken()) } : extra;

function showLogin(msg) {
  setToken("");
  current = null;
  $("#main").innerHTML = `<form class="login" id="login-form"><h2>Вход</h2>
    <div class="sub">Разметка доступна только по паролю администратора. Его знает ответственный за сервис.</div>
    <input type="password" id="password" autocomplete="current-password" required aria-label="Пароль">
    <button type="submit">Войти</button><div class="err">${msg && msg !== "Нужен пароль администратора" ? esc(msg) : ""}</div></form>`;
  $("#password").focus();
  $("#login-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    setToken($("#password").value);
    load();
  });
}
const history = [];  // размеченные в этой сессии — для «назад»
// ?review=1 — проверка меток, которые поставила LLM
const REVIEW = new URLSearchParams(location.search).has("review");
const TITLE = Object.fromEntries(OPTIONS.map(([, code, title]) => [code, title]));
if (REVIEW) document.querySelector("header h1").textContent = "Проверка разметки LLM";

$("#buttons").innerHTML = OPTIONS.map(([key, code, title, hint]) =>
  `<button data-code="${code}"><b><kbd>${key}</kbd>${title}</b>${hint ? `<small>${hint}</small>` : ""}</button>`
).join("") + `<button data-back><b><kbd>⌫</kbd>Назад</b><small>к предыдущей паре</small></button>`;

function record(r, side) {
  const block = (title, text) => `<h4>${title}</h4>` + (text ? `<p>${esc(text)}</p>` : `<p class="empty">нет</p>`);
  const ents = Object.entries(r.entities || {}).flatMap(([k, vs]) => vs.map((v) => ENTITY[k] ? `${ENTITY[k]} ${v}` : v));
  const sub = [`№ ${r.id}`, r.status || "без статуса", r.date_submitted, ...ents].filter(Boolean).join(" · ");
  return `<section class="card"><div class="sub">${side}</div><h2>${esc(r.name)}</h2><div class="sub">${esc(sub)}</div>
    ${block("До улучшения", r.before)}${block("После улучшения", r.after)}${block("Предложения", r.proposal)}</section>`;
}

function show(data) {
  const { done, total } = data.progress;
  $("#progress").textContent = REVIEW ? `проверено ${done} из ${total}` : `размечено ${done} из ${total}`;
  $("#bar").style.width = `${total ? (100 * done) / total : 0}%`;
  current = data.pair;
  if (!current) {
    $("#main").innerHTML = REVIEW
      ? `<div class="done"><h2>Все метки LLM проверены</h2>
          <p><a href="/admin#calib">Подобрать и применить пороги</a></p></div>`
      : `<div class="done"><h2>Все пары размечены</h2>
          <p><a href="/admin#calib">Подобрать и применить пороги</a> — или там же добавить ещё пар.</p></div>`;
  } else {
    const llm = current.label_by === "llm"
      ? `<div class="llm-note">LLM ответила: <b>${esc(TITLE[current.label] || current.label)}</b>${
          current.label_why ? ` — ${esc(current.label_why)}` : ""}
          <br><small>Согласны — нажмите тот же ответ, не согласны — выберите свой.</small></div>` : "";
    $("#main").innerHTML = llm + record(current.a, "ППУ A") + record(current.b, "ППУ B");
  }
  document.querySelectorAll("footer button[data-code]").forEach((b) =>
    b.classList.toggle("picked", Boolean(current) && b.dataset.code === current.label));
  window.scrollTo(0, 0);
}

async function load(pairId) {
  try {
    const r = await fetch("/api/label/pair" + (pairId ? `?pair_id=${encodeURIComponent(pairId)}`
                                                       : REVIEW ? "?review=1" : ""), { headers: auth() });
    const data = await r.json();
    if (r.status === 403) { showLogin(getToken() ? "Неверный пароль" : ""); return; }
    if (r.status === 429) { showLogin(data.detail); return; }
    if (r.status === 404) {
      $("#main").innerHTML = `<div class="done"><h2>Пары для разметки ещё не выбраны</h2>
        <p><a href="/admin#calib">Выбрать пары</a> на странице обновления базы.</p></div>`;
      return;
    }
    if (!r.ok) throw new Error(data.detail);
    show(data);
  } catch (e) {
    $("#main").innerHTML = `<div class="error">Не удалось загрузить пару: ${esc(e.message)}</div>`;
  }
}

async function label(code) {
  if (!current) return;
  const r = await fetch("/api/label", { method: "POST", headers: auth({ "Content-Type": "application/json" }),
                                        body: JSON.stringify({ pair_id: current.pair_id, label: code }) });
  if (r.status === 403) { showLogin("Нужно войти заново"); return; }
  history.push(current.pair_id);
  load();
}

function back() {
  const prev = history.pop();
  if (prev) load(prev);
}

$("#buttons").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.back !== undefined) back(); else label(b.dataset.code);
});
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.target.closest("input, textarea")) return;  // ввод пароля — не разметка
  const opt = OPTIONS.find(([key]) => key === e.key);
  if (opt) { e.preventDefault(); label(opt[1]); }
  else if (e.key === "Backspace") { e.preventDefault(); back(); }
});
load();
</script>
</body>
</html>

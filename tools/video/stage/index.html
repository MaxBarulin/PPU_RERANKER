<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Как устроена проверка ППУ</title>
<style>
@font-face { font-family: "Golos Text"; font-weight: 400 700; src: url("fonts/golos-text-cyrillic.woff2") format("woff2");
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Golos Text"; font-weight: 400 700; src: url("fonts/golos-text-cyrillic-ext.woff2") format("woff2");
  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
@font-face { font-family: "Golos Text"; font-weight: 400 700; src: url("fonts/golos-text-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Golos Text"; font-weight: 400 700; src: url("fonts/golos-text-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
:root {
  --paper: #f3f1ec; --paper-2: #e9e6df; --card: #ffffff; --ink: #1b232c; --ink-2: #3a4652; --muted: #6c7682;
  --rule: #d6d1c7; --red: #c0172e; --red-wash: #f8e3e4; --steel: #3d4b59; --blue: #2b5fb8; --blue-wash: #e2eaf7;
  --amber: #b9780a; --amber-wash: #f7ecd6; --green: #2c8452; --green-wash: #e0f0e6; --violet: #7340ad; --violet-wash: #eee5f7;
  --grey-wash: #e7e4dd;
  --font: "Golos Text", "Inter", sans-serif; --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden;
  background-image: linear-gradient(var(--paper-2) 1px, transparent 1px), linear-gradient(90deg, var(--paper-2) 1px, transparent 1px);
  background-size: 48px 48px; background-position: -1px -1px; }
.scene { position: absolute; inset: 0; opacity: 0; }
.abs { position: absolute; }
.center { left: 0; right: 0; text-align: center; }
h1, h2, h3, p { margin: 0; }
.kicker { font-size: 26px; font-weight: 600; color: var(--red); letter-spacing: 0.01em; }
.title { font-size: 64px; font-weight: 700; line-height: 1.08; letter-spacing: -0.02em; }
.big { font-size: 46px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
.mid { font-size: 34px; font-weight: 600; line-height: 1.25; }
.txt { font-size: 28px; line-height: 1.4; color: var(--ink-2); }
.small { font-size: 22px; line-height: 1.35; color: var(--muted); }
.mono { font-family: var(--mono); }
.card { background: var(--card); border: 2px solid var(--rule); border-radius: 14px; box-shadow: 0 6px 18px rgba(30, 35, 40, 0.07); }
.chip { display: inline-block; padding: 6px 16px; border-radius: 999px; font-size: 24px; font-weight: 600; white-space: nowrap; }
.c-blue { color: var(--blue); background: var(--blue-wash); } .c-red { color: var(--red); background: var(--red-wash); }
.c-amber { color: var(--amber); background: var(--amber-wash); } .c-green { color: var(--green); background: var(--green-wash); }
.c-violet { color: var(--violet); background: var(--violet-wash); } .c-grey { color: var(--muted); background: var(--grey-wash); }
.label { font-size: 20px; font-weight: 600; color: var(--muted); }
svg { overflow: visible; }

/* шапка: логотип и участок */
#top { position: absolute; left: 0; right: 0; top: 0; height: 92px; padding: 24px 56px; display: flex; align-items: center; justify-content: space-between; }
#top img { height: 40px; }
#chapter { display: flex; align-items: center; gap: 10px; font-size: 22px; color: var(--muted); }
#chapter .st { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center;
  font-weight: 700; color: var(--muted); background: var(--paper); }
#chapter .st.on { background: var(--red); border-color: var(--red); color: #fff; }
#chapter .st.done { border-color: var(--steel); color: var(--steel); }
#chapter .name { margin-left: 12px; font-weight: 600; color: var(--ink-2); min-width: 240px; }

/* субтитры */
#subs { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; pointer-events: none; }
#subs span { display: inline-block; max-width: 1500px; padding: 10px 26px; border-radius: 12px; background: rgba(22, 27, 33, 0.82);
  color: #fff; font-size: 33px; line-height: 1.35; font-weight: 500; white-space: pre-line; }

/* браузерное окно с настоящим сервисом */
.browser { position: absolute; border-radius: 14px; overflow: hidden; background: #fff; border: 2px solid #c9c4b9;
  box-shadow: 0 20px 50px rgba(20, 25, 30, 0.18); }
.browser .bar { height: 46px; background: #e6e2da; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.browser .bar i { width: 14px; height: 14px; border-radius: 50%; background: #c9c2b5; display: block; }
.browser .bar .url { margin-left: 18px; flex: 1; height: 30px; border-radius: 8px; background: #f6f4f0; font-size: 18px; color: var(--muted);
  display: flex; align-items: center; padding: 0 14px; }
.browser iframe { border: 0; display: block; transform-origin: 0 0; }
.hl { position: absolute; border: 4px solid var(--red); border-radius: 12px; box-shadow: 0 0 0 9999px rgba(20, 25, 30, 0.0); pointer-events: none; }
#cursor { position: absolute; width: 34px; height: 34px; pointer-events: none; z-index: 50; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="timeline.js"></script>
<script src="mock.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body>
</html>
